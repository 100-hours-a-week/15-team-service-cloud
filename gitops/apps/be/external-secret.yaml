apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: be-secret
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: be-secret
    creationPolicy: Owner
  dataFrom:
  - find:
      path: /commitme/v2/prod/be-server
      name:
        regexp: ".*"
    rewrite:
    - regexp:
        source: "/commitme/v2/prod/be-server/(.*)"
        target: "$1"
