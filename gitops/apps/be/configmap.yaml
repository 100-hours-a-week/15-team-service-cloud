apiVersion: v1
kind: ConfigMap
metadata:
  name: be-config
  namespace: production
data:
  application-prod.yml: |
    server:
      port: 8080

    spring:
      application:
        name: CommitMe
      output:
        ansi:
          enabled: always
      datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: "${PROD_DB_NAME}"
        username: "${PROD_MYSQL_ID}"
        password: "${PROD_MYSQL_PW}"
        hikari:
          register-mbeans: true
          pool-name: CommitmeHikariPool
      data:
        mongodb:
          uri: "${MONGO_URI}"
          auto-index-creation: true
        redis:
          host: "${REDIS_IP}"
          port: 6379
          password: "${REDIS_PW}"

      jpa:
        hibernate:
          ddl-auto: none
        properties:
          hibernate:
            format_sql: false
        show-sql: false

      rabbitmq:
        host: "${RABBITMQ_HOST}"
        port: 5672
        username: "${RABBITMQ_BE_USERNAME}"
        password: "${RABBITMQ_BE_PASSWORD}"
        virtual-host: /

      flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
        baseline-version: "20260204.0"

    logging:
      level:
        org.hibernate.SQL: off
        org.hibernate.type.descriptor.sql: off
        net.ttddyy.dsproxy.listener: info

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      metrics:
        tags:
          application: CommitMe
          env: prod

    app:
      observability:
        jdbc:
          slow-query-threshold-ms: 300
      auth:
        redirect-uri: "${FE_OAUTH_REDIRECT}"
      cors:
        allowed-origins: "${DOMAIN}"
        allowed-methods:
          - "GET"
          - "POST"
          - "PATCH"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        allowed-headers:
          - "*"
        exposed-headers:
          - "Set-Cookie"
        allow-credentials: true
        max-age: 8600
      s3:
        bucket: "${S3_BUCKET_NAME}"
        region: "ap-northeast-2"
        access-key: "${S3_ACCESS_KEY}"
        secret-key: "${S3_SECRET_KEY}"
        cdn-base-url: "https://cdn.commit-me.com"
        presign-duration-minutes: 30
      rabbit:
        queue: commitme.events.queue
        exchange: commitme.events
        routing-key: commitme.events
        notification:
          queue: notification.queue
          exchange: notification.events
          routing-key: notification.requested
      batch:
        outbox-cleanup:
          cron: "0 0 * * * *"
        partition-management:
          cron: "0 0 0 * * *"
      loadtest:
        mock-auth:
          enabled: true
          default-position-id: 1
        mock-ai:
          resume-generate-path: "${AI_GENERATE_PATH_TEST}"

    security:
      jwt:
        secret: "${JWT_SECRET}"
        access-expiration: 1h
        refresh-expiration: 7d
      cookie:
        secure: true
      csrf:
        cookie-domain: "${DOMAIN_CSRF}"
      crypto:
        access-token-key: "${ACCESS_TOKEN_KEY}"

    github:
      client-id: "${GITHUB_CLIENT_ID}"
      client-secret: "${GITHUB_CLIENT_SECRET}"
      redirect-uri: "${GITHUB_OAUTH_REDIRECT}"
      scope: "read:user repo"

    ai:
      base-url: "${AI_BASE_URL}"
      resume-generate-path: "${AI_GENERATE_PATH}"
      resume-edit-path: "${AI_EDIT_PATH}"
      resume-callback-url: "${AI_CALLBACK_PATH}"
      interview-start-path: "${AI_INTERVIEW_START_PATH}"
      interview-answer-path: "${AI_INTERVIEW_ANSWER_PATH}"
      interview-end-path: "${AI_INTERVIEW_END_PATH}"
      interview-callback-url: "${AI_INTERVIEW_CALLBACK_PATH}"
      stt-transcribe-path: "${AI_STT_TRANSCRIBE_PATH}"
      callback-secret: "dev-secret"
