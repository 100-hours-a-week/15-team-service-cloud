apiVersion: apps/v1
kind: Deployment
metadata:
  name: team15-chat
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: team15-chat
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: team15-chat
    spec:
      imagePullSecrets:
      - name: ecr-secret
      terminationGracePeriodSeconds: 60
      containers:
      - name: chat
        image: 248312021437.dkr.ecr.ap-northeast-2.amazonaws.com/commit-me/chat-server:latest
        envFrom:
        - secretRef:
            name: chat-secret
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 30"]
