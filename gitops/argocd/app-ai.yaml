apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 15team-ai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/15-team-service-cloud.git
    targetRevision: argocd
    path: gitops/apps/ai
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
